name: ci

# Platform coverage runs entirely on GitHub-hosted infrastructure: Linux and
# macOS on native runners, FreeBSD inside a VM on an Ubuntu host. No secrets,
# no self-hosted runners. The hasu/nomad boxes are for local pre-push checks
# only and are intentionally not referenced here.

on:
  push:
  pull_request:

# A new push to the same ref cancels the previous run (we work on trunk a lot).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (gnu make)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config
      - name: Toolchain
        run: cc --version && make --version | head -1
      - name: Build
        run: make
      - name: Test
        run: make test

  linux-sanitizers:
    name: linux (asan + ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config
      - name: Build + test with sanitizers
        run: make OPT="-O0 -g" DBG="-fsanitize=address,undefined" test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  linux-tsan:
    name: linux (tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config
      - name: Build + test with the thread sanitizer
        run: make OPT="-O1 -g" DBG="-fsanitize=thread" test

  macos:
    name: macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: brew install libgit2 pkg-config
      - name: Toolchain
        run: cc --version && make --version | head -1
      - name: Build
        run: make
      - name: Test
        run: make test

  freebsd:
    name: freebsd (bsd make)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y git libgit2 pkgconf
          run: |
            cc --version
            make
            make test

  analyze:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config clang-tidy-19
      # .clang-tidy scopes this to the clang static analyzer with findings as
      # errors. Flags are passed directly; no compile_commands.json needed.
      - name: Static analysis
        run: |
          clang-tidy-19 --version | head -1
          clang-tidy-19 src/*.c test/*.c -- \
            -std=c11 -D_DEFAULT_SOURCE -Iinclude -Itest $(pkg-config --cflags libgit2)

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          cppcheck --version
          cppcheck --std=c11 --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --quiet \
            --suppress=missingIncludeSystem -Iinclude -Itest src test

  valgrind:
    name: valgrind (memcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config valgrind
      # Plain -O0 -g build (no sanitizer - valgrind and ASan are incompatible).
      # memcheck traces only the test runner; git/pager subprocesses are exec'd
      # and not followed.
      - name: Build test runner
        run: make OPT="-O0 -g" test/run
      - name: memcheck
        run: |
          valgrind --version
          valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite \
            --suppressions=.github/valgrind.supp ./test/run

  fuzz:
    name: fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config clang
      - name: Build fuzzers
        run: make fuzz FUZZ_CC=clang
      # Bounded run over the committed seed corpora. libFuzzer exits non-zero on
      # any crash/leak/timeout, which fails the job.
      - name: Run (bounded)
        run: |
          for f in score path key; do
            echo "== fuzz_$f =="
            ./fuzz/fuzz_$f fuzz/corpus_$f -max_total_time=30 -timeout=10
          done

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin the major version so local (clang-format19) and CI never disagree.
      - name: Install clang-format-19
        run: sudo apt-get update && sudo apt-get install -y clang-format-19
      - name: Check formatting
        run: |
          clang-format-19 --version
          files=$(find src include test -type f \( -name '*.c' -o -name '*.h' \))
          clang-format-19 --dry-run --Werror $files
